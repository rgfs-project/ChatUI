<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the page paint into the display cutout and the
      home-indicator strip; the layout then holds its own contents clear with
      `env(safe-area-inset-*)`. Without it the browser letterboxes the page and
      the insets all report 0, so there is nothing to opt into later.

      `interactive-widget=resizes-content` makes the on-screen keyboard shorten
      the layout viewport instead of sliding the page up under itself. That is
      what lets the composer stay above the keys in CSS alone — `100dvh` simply
      becomes the smaller number — rather than by measuring `visualViewport`
      and writing positions from JavaScript on every resize.

      Zoom is left alone. `maximum-scale=1, user-scalable=no` was here to stop
      iOS zooming a layout that is an application rather than a document — a
      fixed header, a composer pinned to the bottom, a drawer over the side —
      on gestures meant for it: a two-finger scroll, a second tap that lands
      too soon, focusing the message field.

      It bought less than it cost. Safari has ignored `user-scalable=no` since
      iOS 10, so the gestures it was aimed at were never actually prevented
      there; what it did prevent was a reader with low vision pinching to
      enlarge the text on every other phone, which is WCAG 1.4.4 and what axe
      reports as `meta-viewport`. The one trigger it genuinely stopped, iOS
      zooming when the message field takes focus, is held off by giving every
      field a 16px font on a coarse pointer (the touch block in
      `components.css`) — which is what actually governs that behaviour.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>ChatUI</title>

    <!--
      The theme is applied before the first paint.

      React can only set it once it has mounted, which is at least one paint
      too late: a dark-mode user got a full white frame on every reload. This
      runs synchronously in the head, so the very first frame is already right.

      `colorScheme` is set inline as well as the attribute. The attribute needs
      the stylesheet to have loaded to mean anything; `color-scheme` tells the
      browser what to paint the canvas *before* any CSS arrives, which is the
      part that was actually flashing white.

      The key must stay in step with THEME_KEY in `client/App.tsx`; there is a
      test that fails if they drift.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('workspace.theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          // Storage unavailable (private mode, blocked cookies). Light is the
          // default anyway, so there is nothing to recover from.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
