# ChatUI — supported production runtime (Docker Compose or rootless Podman Compose).
#
# The port is published on 127.0.0.1 only. PUBLIC_ORIGIN defaults to
# http://localhost:3000 (this computer). For LAN or phone access, put an
# https TLS proxy (e.g. Caddy or Tailscale HTTPS) in front, set PUBLIC_ORIGIN to
# its https URL and TRUST_PROXY to the number of proxy hops. Plain-http LAN
# access is not supported.
name: chatui

services:
  chatui:
    build:
      context: .
    image: ${CHATUI_IMAGE:-localhost/chatui:local}
    init: true
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set this when HOST_PORT is not 3000 or when serving through a TLS proxy.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}
      # llama.cpp server as seen from INSIDE the container (not localhost):
      # a LAN address, host.containers.internal (Podman), or host.docker.internal
      # with the extra_hosts entry below (Docker Engine on Linux).
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-}
      # Secret: set it in .env (git-ignored), never on the command line.
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
    # Docker Engine on Linux only (Podman provides host.containers.internal):
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - chatui-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Declared here as well as in the Dockerfile: Podman/buildah builds OCI-format
    # images, which cannot carry a HEALTHCHECK instruction.
    healthcheck:
      test: ["CMD", "node", "server/cli.ts", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s

volumes:
  chatui-data:
    name: ${CHATUI_VOLUME:-chatui-data}
